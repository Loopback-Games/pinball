name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# Never run two deployments at once, and let a newer push supersede a queued
# one rather than deploying stale output after it. Keyed by ref so a pull
# request check cannot cancel a deployment of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build never pushes, so leaving a credential in .git/config for
          # everything downstream to pick up buys nothing.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run fmt:check
      # Fails the build on a high or critical advisory in the toolchain. The
      # shipped bundle has no dependencies, but everything that produces it
      # does.
      - run: npm run security
      - run: npm test
      - run: npm run build

      # Drive the built game in a real browser. The unit tests cannot see the
      # canvas, the input handling or the page boot, and a bug in any of those
      # ships a blank screen with every test passing.
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the built game
        run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on -t 60000 http://localhost:4173/
          node scripts/smoke.mjs http://localhost:4173/ screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

      # A pull request gets every check above and stops there. Only a push to
      # main produces a deployable artifact.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
