name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job needs to read the repo and mint a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once, and let a newer push supersede a queued
# one rather than deploying stale output after it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Drive the built game in a real browser. The unit tests cannot see the
      # canvas, the input handling or the page boot, and a bug in any of those
      # ships a blank screen with every test passing.
      - run: npx playwright install --with-deps chromium
      - name: Smoke test the built game
        run: |
          npx vite preview --port 4173 --strictPort &
          npx wait-on -t 60000 http://localhost:4173/
          node scripts/smoke.mjs http://localhost:4173/ screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: screenshots
          path: screenshots
          retention-days: 7

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
