<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      The page loads its own module and nothing else: no fonts, no analytics,
      no CDN. Saying so lets the browser refuse anything that turns up anyway.
      Inline styles are allowed because the shell below is one; scripts are
      not, which is the half that matters.

      frame-ancestors, report-uri and sandbox are ignored in a meta policy, so
      they are deliberately not here rather than accidentally missing.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060e" />
    <meta
      name="description"
      content="A browser pinball table built entirely from procedurally generated art and synthesised sound."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Loopback Pinball</title>
    <!-- Drawn here rather than fetched, like everything else in the game. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2304060e'/%3E%3Ccircle cx='16' cy='17' r='8' fill='%23c8d4e8'/%3E%3Ccircle cx='13' cy='14' r='2.6' fill='%23ffffff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #04060e;
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
        /* Stop iOS bouncing the page when a thumb drags on the flippers. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #table {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* The canvas is focusable so a keyboard user can find the game at all.
         It has to say so visibly when it has focus, and only for keyboard
         focus: a ring appearing under every thumb tap would be noise. */
      #table:focus-visible {
        outline: 2px solid #6fe3ff;
        outline-offset: -3px;
      }
      #noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #e8f0ff;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Everything on screen is painted into this one canvas, so the label is
         the only description of the game assistive technology ever gets, and
         it has to carry the controls with it. role=application asks the screen
         reader to pass keystrokes through to the page rather than treating
         them as browse commands. -->
    <canvas
      id="table"
      tabindex="0"
      role="application"
      aria-label="Loopback Pinball. Press Enter to start a game, hold Space and release to
      launch the ball, and use Z and forward slash for the left and right flippers. Press S
      for sound effects and M for music."
    ></canvas>
    <noscript>
      <div id="noscript">
        <p>Loopback Pinball needs JavaScript to run.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
