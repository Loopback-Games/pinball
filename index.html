<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04060e" />
    <meta
      name="description"
      content="A browser pinball table built entirely from procedurally generated art and synthesised sound."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Loopback Pinball</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #04060e;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        /* Stop iOS bouncing the page when a thumb drags on the flippers. */
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #table {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #noscript {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #e8f0ff;
        padding: 2rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="table"></canvas>
    <noscript>
      <div id="noscript">
        <p>Loopback Pinball needs JavaScript to run.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
